# SysML v2 MBSE — 一键启动（开发环境）
#
# 用法：
#   docker compose up --build          # 后端 + 前端
#   docker compose down -v             # 停止并清理数据卷
#
# 访问：
#   前端 http://localhost:3000
#   后端 http://localhost:8080/health
#
# 数据：
#   backend-data (volume) → /data/sysmlv2.db
#
# M1 备注：DB 仍为 SQLite（modernc.org 纯 Go，无需 CGO）。
#         迁移到 PostgreSQL 在 M2-M3 阶段完成（见 timeline_v2.md §2.3）。

name: sysmlv2-mbse

services:
  backend:
    build:
      context: ./poc-v2/backend
      dockerfile: Dockerfile
    image: sysmlv2-mbse/backend:dev
    container_name: sysmlv2-backend
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_PATH: /data/sysmlv2.db
      GIN_MODE: release
    volumes:
      - backend-data:/data
    healthcheck:
      # 旧版 ["CMD", "/app/server", "-version"] 不可用：
      # 1) main.go 没有 -version flag（程序启动后立即 listen，这个
      #    flag 永远不会 return）
      # 2) 即便有，/app/server 默认 8080 端口已 listen，-version 路径
      #    也走不到 healthcheck
      # 改用 wget 主动 GET /health（Gin 注册的路由）。
      # 配套：backend Dockerfile 换 alpine 才有 wget（distroless 没有）。
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./poc-v2/frontend
      dockerfile: Dockerfile
    image: sysmlv2-mbse/frontend:dev
    container_name: sysmlv2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      # 前端运行时无需环境变量；nginx 通过内部 DNS 访问 backend
      BACKEND_URL: http://backend:8080

volumes:
  backend-data:
    driver: local
    name: sysmlv2-backend-data
