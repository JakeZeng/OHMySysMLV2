# nginx 配置：静态文件 + API 反代
#
# 路径：
#   /          → 静态文件（Vite build 产物）
#   /api/*     → 后端 Go 服务（Gin on :8080）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端 SPA 路由：未匹配路径 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API 反代
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SSE 事件流（/api/v1/events/stream）
    #
    # 这一段是**显式冗余**，不是修复——如实记录实测结论，别再当"生产阻断"传：
    #   1. 后端已在响应头里带 `X-Accel-Buffering: no`
    #      （backend/internal/handler/eventsHandler.go:57），nginx 见到该头
    #      就会对**这个响应**关掉缓冲；
    #   2. 实测（nginx:1.27-alpine 容器 + 真后端，A/B 对照）：
    #      默认 `proxy_buffering on` 的 `location /api/` 与这里的新 location，
    #      两者 ttfb 都是 ~18ms，事件帧都立刻到达 → nginx 本身不拦 SSE。
    #      （对照实验：同款上游去掉 `X-Accel-Buffering` 头，nginx 依然透传，
    #        说明真正起作用的是"上游每次写一帧、nginx 每次读一段就下推"，
    #        而不是必须靠响应头。）
    #
    # 保留独立 location 的理由是**防御**：将来后端若不再带该头、或中间再加一层
    # CDN/网关（那层默认会缓冲），SSE 会静默失效；显式写死 buffering off
    # + 长读超时，比"指望上游记得带头"可靠。
    location /api/v1/events/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 专用：关掉缓冲、关缓存、连接保持、长读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        # 后端每 15s 发一次 `: keepalive` 保活，通用 /api/ 的 60s 本就够用；
        # 这里给足余量，避免长时间无事件的场景被 nginx 掐断
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查
    location = /health {
        proxy_pass http://backend:8080/health;
    }
}
