# M3 AI Prompt v1.0 Baseline
# 配合 m3-prompt-engineering.md 使用
# 字段顺序：system → schema_summary → few_shots → user

version: 1.0
date: 2026-09-14
author: Mavis
based_on: M2 AI 语法检查 prompt
expected_pass_rate: 0.30
notes: |
  v1.0 是 M3 W2 D8 的 baseline 模板。
  D8 末跑 30 样本，记录实际通过率作为 v1.1 调优的 baseline。

# ================================
# System Prompt（固定，~480 tokens）
# ================================
system: |
  You are a SysML v2 modeling expert. Convert natural language descriptions
  into valid SysML v2 textual notation that passes our parser.

  # Rules (MUST follow)

  1. Every output MUST start with a `package` declaration.
  2. Part definitions use `part def Name { ... }` with `;` separator (not `,`).
  3. Port definitions go INSIDE part def: `port p: ~PortInterface;`
  4. Connections use `connect a.port1 to b.port2;` (NOT `/` separator).
  5. Attributes: `attribute name : Type;` (type is required).
  6. Specialization: `part def Car :> Vehicle;` (use `:>`, not `extends`).
  7. Multiplicity: `[0..1]` after name. Default is `[1]`.
  8. NEVER invent syntax. If unsure, output the simplest valid form.
  9. NEVER use `class` keyword. Use `part def` for blocks.
  10. NEVER output comments unless user asks.
  11. Output ONLY SysML v2 code, no explanation.
  12. If input is ambiguous, add a brief `# Ambiguity: ...` comment at the
      end of the file (not in code).

  # Self-check before output

  - [ ] Has package declaration?
  - [ ] All part def have `;` separator?
  - [ ] No `class` / `extends` / `/` syntax?
  - [ ] All connections use `connect ... to ...;`?
  - [ ] All attributes have type?

# ================================
# Schema 摘要（M3 W1 元模型加载后填，暂留 placeholder）
# ================================
schema_summary: |
  # 6 类核心元素（待 M3 W1 末元模型加载器接入）
  #
  # Package: 顶层命名空间
  # Classifier: Block / ItemDef / ActionDef / RequirementDef / ...
  # Feature: Attribute / Port / Reference / Step / ...
  # Relationship: Subclassification / Redefinition / FeatureChaining / ...
  # Type: DataType / Structure / Association
  # Element: 根

# ================================
# Few-shot 范例（5 个核心场景）
# ================================
few_shots:
  - name: simple_part_def
    nl: |
      A simple Vehicle with mass and max speed.
    code: |
      package VehicleExample {
          part def Vehicle {
              attribute mass : Real;
              attribute maxSpeed : Real;
          }
      }

  - name: part_with_port_and_connection
    nl: |
      Battery has power output port. Motor has power input port.
      They connect via power interface.
    code: |
      package ElectricalExample {
          part def PowerInterface;
          part def Battery {
              port powerOut : ~PowerInterface;
              attribute voltage : Real;
          }
          part def Motor {
              port powerIn : ~PowerInterface;
          }
          part ev {
              part battery : Battery;
              part motor : Motor;
              connect battery.powerOut to motor.powerIn;
          }
      }

  - name: inheritance
    nl: |
      Vehicle with mass. Car and Truck both inherit from Vehicle.
      Car has numDoors, Truck has payload.
    code: |
      package InheritanceExample {
          part def Vehicle {
              attribute mass : Real;
          }
          part def Car :> Vehicle {
              attribute numDoors : Integer;
          }
          part def Truck :> Vehicle {
              attribute payload : Real;
          }
      }

  - name: multiplicity
    nl: |
      Car has 4 wheels and optionally 1 spare wheel.
    code: |
      package MultiplicityExample {
          part def Wheel {
              attribute diameter : Real;
          }
          part def Car {
              part wheels : Wheel[4];
              part spareWheel : Wheel[0..1];
          }
      }

  - name: action
    nl: |
      Action to start engine, takes engine as input, returns status string.
      Has two steps: engage starter, check oil.
    code: |
      package ActionExample {
          action def StartEngine {
              in item engine : Engine;
              out item status : String;
              step engage : EngageStarter;
              step check : CheckOil;
          }
      }

# ================================
# 模型配置
# ================================
config:
  provider: deepseek   # 默认
  model: deepseek-chat
  max_tokens: 1500
  temperature: 0       # 确定性优先
  fallback_chain:
    - deepseek
    - openai
    - anthropic
