name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  # ─── 1. TS 核心：parser/validator/transform 测试 ─────────────────────
  parser-validator:
    name: Parser & Validator (TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-v2
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: poc-v2/package-lock.json

      - name: Install root dependencies
        working-directory: poc-v2
        run: npm ci --no-audit --no-fund

      - name: Generate parser
        run: npm run parser:build

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

  # ─── 2. 前端：build + 单元测试 ──────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-v2/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: poc-v2/frontend/package-lock.json

      - name: Install root deps (for parser)
        working-directory: poc-v2
        run: npm ci --no-audit --no-fund

      - name: Generate parser (frontend build dep)
        working-directory: poc-v2
        run: npm run parser:build

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  # ─── 3. 后端：Go build + test ───────────────────────────────────────
  backend:
    name: Backend (Go + Gin + SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-v2/backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: true
          cache-dependency-path: poc-v2/backend/go.sum

      - name: Download deps
        run: go mod download

      - name: Build
        run: go build -o sysmlv2-backend ./cmd/server

      - name: Run tests
        run: go test ./... -count=1

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sysmlv2-backend
          path: poc-v2/backend/sysmlv2-backend
          if-no-files-found: error
          retention-days: 7

  # ─── 4. Docker 镜像构建（M1 smoke test）─────────────────────────────
  docker:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        working-directory: poc-v2/backend
        run: docker buildx build -t sysmlv2-mbse/backend:ci -f Dockerfile .

      - name: Build frontend image
        # frontend Dockerfile 的 build context 是仓库根 (poc-v2/)，
        # 因为它需要同时 COPY frontend/ 和 parser/。
        # 详见 poc-v2/frontend/Dockerfile 头部说明。
        working-directory: poc-v2
        run: docker buildx build -t sysmlv2-mbse/frontend:ci -f frontend/Dockerfile .

  # ─── 5. E2E：Playwright（启动后端 + 前端 + 跑测试）──────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            poc-v2/package-lock.json
            poc-v2/frontend/package-lock.json

      - name: Install root deps (parser generator)
        working-directory: poc-v2
        run: npm ci --no-audit --no-fund

      - name: Generate parser
        working-directory: poc-v2
        run: npm run parser:build

      - name: Install frontend deps
        working-directory: poc-v2/frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        working-directory: poc-v2/frontend
        run: npx playwright install --with-deps chromium

      - name: Setup Go (for backend)
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Build backend
        working-directory: poc-v2/backend
        run: go build -o sysmlv2-backend ./cmd/server

      - name: Start backend
        working-directory: poc-v2/backend
        run: |
          ./sysmlv2-backend &
          BACKEND_PID=$!
          # 等就绪
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/health >/dev/null 2>&1; then
              echo "Backend ready"
              break
            fi
            sleep 1
          done
          echo "Backend PID: $BACKEND_PID"

      - name: Start frontend (preview built)
        working-directory: poc-v2/frontend
        run: |
          npm run build
          npm run preview -- --port 3000 --host &
          sleep 5

      - name: Run E2E tests
        working-directory: poc-v2/frontend
        run: npx playwright test --reporter=github
        env:
          CI: 'true'

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: poc-v2/frontend/playwright-report/
          retention-days: 7

  # ─── 6. 所有 job 通过后状态汇总 ─────────────────────────────────────
  status:
    name: ✅ All Checks
    needs: [parser-validator, frontend, backend, docker, e2e]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All jobs passed"
